server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The /api/simulate response carries a per-deal matrix (~250-300 KB raw at
    # 1000 deals); gzip brings it down to a few tens of KB.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Proxy API calls to the FastAPI backend (same-origin, so no CORS in prod).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A 1000-deal DDS solve can take several seconds.
        proxy_read_timeout 120s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
