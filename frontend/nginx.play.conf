server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Analysis responses carry every legal card's expected tricks at every
    # decision; gzip keeps that to a few KB.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Proxy API calls to the FastAPI play app (same-origin, so no CORS in prod).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A 26-decision analyze at 100 deals is a Monte-Carlo + DDS batch per
        # decision — minutes, not seconds, on the 2-vCPU box.
        proxy_read_timeout 300s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
