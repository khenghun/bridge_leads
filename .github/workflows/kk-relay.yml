# kk_relay: the KK Relay display, a static page under kk_relay/ served by its
# own nginx image and its own stack on the VPS (/opt/kk_relay). It shares the
# repo and the VPS with the bridge products but none of their code, so it has
# its own workflow: only changes under kk_relay/ (or this file) build it, and
# the bridge workflow (deploy.yml) never touches it. Same gate as the bridge
# stacks — a push builds and pushes the image, only a manual "Run workflow"
# deploys. There is no test job: the page's only check (verify.js) needs the
# source book, which is not in the repo.
name: KK Relay — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "kk_relay/**"
      - "deploy/kk_relay/**"
      - ".github/workflows/kk-relay.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (a commit SHA for rollback, or latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/kk_relay-frontend

jobs:
  build:
    # Builds on a push to the paths above, and on dispatch so a deploy of
    # `latest` always has an image for the current commit.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./kk_relay
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=kk-relay
          cache-to: type=gha,scope=kk-relay,mode=max

  deploy:
    # Manual gate, same as deploy-lead / deploy-play: its own compose file,
    # its own directory on the VPS (pre-created by hand, deploy/provision.md
    # §4), its own image tag.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/kk_relay/docker-compose.prod.yml"
          strip_components: 2
          target: /opt/kk_relay

      - name: Pull image & restart stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/kk_relay
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
