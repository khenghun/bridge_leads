# Test+build images on every main commit; deploy to the VPS only when a human
# clicks "Run workflow" (workflow_dispatch), picking which product stack to
# deploy. Tests and builds always cover every product — shared engine/frontend
# code means a change anywhere must run every consumer's suite. See
# docs/lead/v1.0-deploy-plan.md and docs/two-products-one-repo.md.
name: Test, Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: "Which product stack to deploy"
        type: choice
        options:
          - lead
          - play
          - worker
        default: lead
      image_tag:
        description: "Image tag to deploy (a commit SHA for rollback, or latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  # github.repository = khenghun/bridge_leads → ghcr.io/khenghun/bridge_leads-{backend,frontend}.
  # The backend image is shared by both products (it carries app/ and app_play/;
  # each stack picks its entrypoint with `command:`). Frontends are per product.
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  PLAY_FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bridge_play-frontend
  # The play solver's Lambda worker (docs/play/v1.5-lambda-strict-plan.md)
  # lives in ECR, not GHCR. Only the repository NAME is written here: the
  # registry host (which carries the account id) comes from the ECR login
  # step at run time, and the deploy role's ARN is the AWS_DEPLOY_ROLE_ARN
  # secret. Region is the one nearest the VPS.
  AWS_REGION: ap-southeast-1
  WORKER_REPO: bridge-play-worker
  WORKER_FUNCTION: bridge-play-worker

jobs:
  # One test job for everything: the monorepo's contract is that a change to
  # shared code (engine/, lib/bridge.ts, components/) runs every product's
  # tests. The frontend typecheck (tsc -b) rides inside the image build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend tests (pytest)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests (vitest)
        working-directory: frontend
        run: |
          npm ci
          npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            APP=lead
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push play frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            APP=play
          push: true
          tags: |
            ${{ env.PLAY_FRONTEND_IMAGE }}:latest
            ${{ env.PLAY_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-play
          cache-to: type=gha,scope=frontend-play,mode=max

  build-worker:
    # The play solver's Lambda worker: the backend Dockerfile's `worker` target
    # (same engine, plus the Lambda runtime client and worker/handler.py),
    # pushed to ECR under the same tags as the GHCR images so API and worker
    # can be deployed as a pair. Authenticates through the GitHub OIDC deploy
    # role — no long-lived AWS key anywhere. Needs the AWS_DEPLOY_ROLE_ARN
    # secret; until it is set this job fails on its own and nothing else waits
    # on it.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.WORKER_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.WORKER_REPO }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy-worker:
    # Points the Lambda function at the pushed image. Runs with a play deploy
    # (the pair moves together) or on its own with stack=worker (the v1.5
    # spike, before the API has a client). The function itself is created
    # once by hand in the console (deploy/provision.md §9) — until it exists
    # this job just says so and succeeds, so the very first image push works.
    if: github.event_name == 'workflow_dispatch' && (inputs.stack == 'play' || inputs.stack == 'worker')
    needs: build-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          set -e
          if ! aws lambda get-function --function-name "$WORKER_FUNCTION" >/dev/null 2>&1; then
            echo "::notice::Function $WORKER_FUNCTION does not exist yet — create it from the pushed image (deploy/provision.md §9); nothing to update."
            exit 0
          fi
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          URI="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$WORKER_REPO:$IMAGE_TAG"
          aws lambda update-function-code --function-name "$WORKER_FUNCTION" --image-uri "$URI" >/dev/null
          aws lambda wait function-updated --function-name "$WORKER_FUNCTION"
          aws lambda get-function-configuration --function-name "$WORKER_FUNCTION" \
            --query '{state:State,updated:LastModified,memory:MemorySize,timeout:Timeout}' --output table

  deploy-lead:
    # Manual gate: only a workflow_dispatch run deploys; plain pushes stop at
    # build. One deploy job per product stack, selected by the `stack` input,
    # so each product's prod version is managed independently.
    if: github.event_name == 'workflow_dispatch' && inputs.stack == 'lead'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the VPS copy of the compose file in sync with the repo. TLS/routing
      # moved to the shared edge stack (/opt/edge, owned by the FBO repo's
      # deploy/edge/) — no Caddyfile here anymore. Per-stack compose files live
      # under deploy/<stack>/; strip_components flattens the repo path so the
      # file lands as /opt/bridge_leads/docker-compose.prod.yml as before.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/lead/docker-compose.prod.yml"
          strip_components: 2
          target: /opt/bridge_leads

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/bridge_leads
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  deploy-play:
    # The play solver's stack, same mechanics as deploy-lead: its own compose
    # file, its own directory on the VPS, its own image tag — so a play deploy
    # never touches the lead containers (and vice versa).
    if: github.event_name == 'workflow_dispatch' && inputs.stack == 'play'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/play/docker-compose.prod.yml"
          strip_components: 2
          target: /opt/bridge_play

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            mkdir -p /opt/bridge_play/data
            cd /opt/bridge_play
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
