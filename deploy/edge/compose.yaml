# Shared Caddy edge for every app on the VPS.
# Lives in this repo (deploy/edge/; moved here from the retired FBO repo
# 2026-10-16), copied to /opt/edge on the VPS by the deploy workflow (stack `edge`). Caddy is the only
# container publishing 80/443; each app joins the external `edge` docker network and gets
# a site block in ./Caddyfile.
#
#   docker network create edge        # one-time, before first `up`
#   cd /opt/edge && docker compose up -d
name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # The whole directory, not the single file: a single-file bind mount
      # pins the inode, so a Caddyfile replaced by scp (the deploy-edge job)
      # is invisible inside the container and `caddy reload` reports "config
      # is unchanged" (bitten 2026-10-16). Caddy reads /etc/caddy/Caddyfile;
      # compose.yaml being visible beside it is harmless.
      - .:/etc/caddy:ro
      - caddy_data:/data # Let's Encrypt certs — must persist across restarts
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
