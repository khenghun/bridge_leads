# Opening Lead Simulator — production stack (Vultr VPS).
#   Requires a .env next to this file with DOMAIN=<yourdomain> (see deploy/.env.example).
#   docker compose -f docker-compose.prod.yml up -d
#
# TLS and routing live in the shared edge stack (/opt/edge — source of truth:
# the FBO repo's deploy/edge/), not here: this stack publishes no ports. The edge
# Caddy reaches frontend/backend through the external `edge` docker network via
# the bl-* aliases below; backend<->frontend traffic stays on the default network.
# Images are built by CI (.github/workflows/deploy.yml) — the VPS only pulls.
services:
  backend:
    image: ghcr.io/khenghun/bridge_leads-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # DDS worker-thread cap (0 = all cores). 2-vCPU VPS: let DDS use both.
      BRIDGE_DDS_THREADS: "2"
      # Query log: one row per simulation (timestamp + tool + request body).
      # Unset this to turn logging off entirely.
      BRIDGE_QUERY_LOG: /data/queries.db
    volumes:
      # Bind-mounted, not a named volume, so the log survives image pulls and
      # can be read with the host's sqlite3 without entering the container.
      - ./data:/data
    expose:
      - "8000"
    networks:
      default: {}
      edge:
        aliases:
          - bl-backend

  frontend:
    image: ghcr.io/khenghun/bridge_leads-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      default: {}
      edge:
        aliases:
          - bl-frontend

networks:
  default: {}
  edge:
    external: true
