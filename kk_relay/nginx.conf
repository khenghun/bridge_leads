server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html application/javascript text/css;
    gzip_min_length 1024;

    # Two files, no routes: anything else is a 404, not an SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }
}
